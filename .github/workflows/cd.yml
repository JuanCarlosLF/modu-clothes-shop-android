name: MODU CD

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: read

concurrency:
  group: modu-releases
  cancel-in-progress: false

jobs:
  execute-ci:
    if: >
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'release')
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.event.pull_request.merge_commit_sha }}

  validate-metadata:
    needs: execute-ci
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.metadata.outputs.version_name }}
      version_code: ${{ steps.metadata.outputs.version_code }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      release_notes_path: ${{ steps.metadata.outputs.release_notes_path }}
    steps:
      - name: Download merged repository state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Validate merged release metadata
        id: metadata
        env:
          MERGE_COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: bash .github/scripts/validate-merged-release-metadata.sh

      - name: Validate release notes
        run: bash .github/scripts/validate-release-notes.sh

  publish-release:
    needs: validate-metadata
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download merged repository state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Make Gradle wrapper executable
        working-directory: Project
        run: chmod +x gradlew

      - name: Rebuild release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          keystore_path="$RUNNER_TEMP/modu-release.jks"
          umask 077
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"

          if [[ ! -s "$keystore_path" ]]; then
            echo "::error::The reconstructed release keystore is empty"
            exit 1
          fi

          echo "RELEASE_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"
          echo "Release keystore reconstructed in the temporary runner directory"

      - name: Generate release APK
        working-directory: Project
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleDemoRelease --no-daemon

      - name: Locate release APK
        run: |
          set -euo pipefail

          mapfile -t apk_files < <(find Project/app/build/outputs/apk/demo/release -maxdepth 1 -type f -name '*.apk' -print)
          if (( ${#apk_files[@]} != 1 )); then
            echo "::error::Expected exactly one demoRelease APK, found ${#apk_files[@]}"
            exit 1
          fi

          echo "RELEASE_APK_PATH=${apk_files[0]}" >> "$GITHUB_ENV"
          echo "Release APK found: ${apk_files[0]}"

      - name: Verify APK signing
        env:
          EXPECTED_VERSION_CODE: ${{ needs.validate-metadata.outputs.version_code }}
          EXPECTED_VERSION_NAME: ${{ needs.validate-metadata.outputs.version_name }}
        run: |
          set -euo pipefail

          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$sdk_root" ]]; then
            echo "::error::Android SDK path is not available"
            exit 1
          fi

          apksigner_path="$(find "$sdk_root/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [[ -z "$apksigner_path" ]]; then
            echo "::error::apksigner was not found in the Android SDK"
            exit 1
          fi

          "$apksigner_path" verify --verbose "$RELEASE_APK_PATH"
          "$apksigner_path" verify --print-certs "$RELEASE_APK_PATH"

          aapt_path="$(find "$sdk_root/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          if [[ -z "$aapt_path" ]]; then
            echo "::error::aapt was not found in the Android SDK"
            exit 1
          fi

          badging="$($aapt_path dump badging "$RELEASE_APK_PATH")"
          package_name="$(printf '%s\n' "$badging" | sed -nE "s/^package: name='([^']+)'.*/\1/p")"
          version_code="$(printf '%s\n' "$badging" | sed -nE "s/^package:.*versionCode='([^']+)'.*/\1/p")"
          version_name="$(printf '%s\n' "$badging" | sed -nE "s/^package:.*versionName='([^']+)'.*/\1/p")"

          if [[ "$package_name" != "com.juancarloslf.modu" ]]; then
            echo "::error::Unexpected APK package: $package_name"
            exit 1
          fi

          if [[ "$version_code" != "$EXPECTED_VERSION_CODE" || "$version_name" != "$EXPECTED_VERSION_NAME" ]]; then
            echo "::error::APK version $version_name ($version_code) does not match expected $EXPECTED_VERSION_NAME ($EXPECTED_VERSION_CODE)"
            exit 1
          fi

          echo "Verified APK package and version: $package_name $version_name ($version_code)"

      - name: Prepare versioned APK
        env:
          RELEASE_TAG: ${{ needs.validate-metadata.outputs.release_tag }}
        run: |
          set -euo pipefail

          versioned_apk_path="$RUNNER_TEMP/modu-demo-$RELEASE_TAG.apk"
          cp "$RELEASE_APK_PATH" "$versioned_apk_path"
          echo "VERSIONED_APK_PATH=$versioned_apk_path" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          RELEASE_NOTES_PATH: ${{ needs.validate-metadata.outputs.release_notes_path }}
          RELEASE_TAG: ${{ needs.validate-metadata.outputs.release_tag }}
        run: |
          set -euo pipefail

          gh release create "$RELEASE_TAG" "$VERSIONED_APK_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$MERGE_COMMIT_SHA" \
            --title "MODU $RELEASE_TAG" \
            --notes-file "$RELEASE_NOTES_PATH"

      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/modu-release.jks"
