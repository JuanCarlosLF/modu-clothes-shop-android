name: MODU CI

on:
  workflow_call:
    inputs:
      ref:
        description: Git reference to check out when CI is called by another workflow.
        required: false
        type: string
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  build-and-test:
    name: Run unit tests and build app variants
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Make Gradle wrapper executable
        working-directory: Project
        run: chmod +x gradlew
      - name: Execute unit tests
        working-directory: Project
        run: ./gradlew test
      - name: Assemble app variants
        working-directory: Project
        run: ./gradlew assembleDemoDebug assembleRemoteDebug assembleDemoRelease assembleRemoteRelease
