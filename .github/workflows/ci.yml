name: MODU CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  build-and-test:
    name: Build and run unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Execute unit test
        working-directory: Project
        run: ./gradlew test
      - name: Assemble app variants
        working-directory: Project
        run: ./gradlew assembleDemoDebug assembleRemoteDebug
