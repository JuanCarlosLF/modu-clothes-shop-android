name: MODU CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  build-and-test:
    name: Run unit tests and build app variants
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Make Gradle wrapper executable
        working-directory: Project
        run: chmod +x gradlew
      - name: Execute unit tests
        working-directory: Project
        run: ./gradlew test
      - name: Assemble app variants
        working-directory: Project
        run: ./gradlew assembleDemoDebug assembleRemoteDebug assembleDemoRelease assembleRemoteRelease
